# Pull requests run shared checks; pushes to main run the pipeline flows. Release tags use the local pre-push
# checks; CI builds and verifies each native installer before publishing.
name: Desktop

on:
  push:
    # main: simulated-LLM pipeline tests after merge; v* tags: native builds and release.
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Every pull request reports "Shared checks" so it can be a required status check; docs-only changes skip the work.
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        name: Detect code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          # Docs-only means every changed file is documentation; anything else runs the checks.
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Evq '\.md$|^\.docs/|^LICENSE$|^NOTICE$'; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Shared checks
    needs: scope
    # A job skipped by this condition reports success, so docs-only pull requests satisfy a required check.
    # Only a successful scope result of docs-only skips it; a failed scope job still runs the checks.
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name != 'pull_request' || needs.scope.outputs.code != 'false') }}
    # macOS is the shipped Unix platform for the CLI/server and desktop runtime JavaScript (tag builds run only
    # cargo test); Rust tests, formatting and native packaging are checked by the tag build jobs below.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Locate pnpm store
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('.nvmrc') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Fast tier; provider matrix, heavy cases and shipped-book checks run via pnpm test:providers / test:books.
      - run: pnpm test

  flows:
    name: Pipeline flows
    # PR checks skip the controlled production-pipeline tests; run them after each merge to main without
    # blocking pull requests. A newer push to main cancels an older run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pipeline-flows-main
      cancel-in-progress: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Locate pnpm store
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('.nvmrc') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:flows

  build:
    name: Desktop / ${{ matrix.platform }} ${{ matrix.arch }}
    needs: checks
    # Installers are built for release tags and manual runs only, never for pull requests or main pushes.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.checks.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos, arch: arm64}
          - {os: windows-2022, platform: windows, arch: x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Check native architecture and release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.equal(process.arch, process.env.ARCH, 'Node must match the native runner architecture');
          if (process.env.EVENT_NAME === 'push') {
            const tag = process.env.RELEASE_TAG;
            assert.match(tag, /^v\d+\.\d+\.\d+$/, 'Release tags must use vX.Y.Z (no prereleases)');
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              assert.equal(JSON.parse(readFileSync(file, 'utf8')).version, tag.slice(1), `${file} must match ${tag}`);
            }
            const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m);
            assert.equal(cargo?.[1], tag.slice(1), `src-tauri/Cargo.toml must match ${tag}`);
          }
          NODE
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm install --frozen-lockfile
      - name: Build shared reader, desktop UI, and runtime resources
        run: |
          pnpm run build
          pnpm exec vite build --config desktop/vite.config.ts
          node scripts/desktop-resources.mjs
      # Native Rust behavior and the packaged runtime must be checked on their actual OS.
      - name: Test and package macOS desktop
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          mkdir -p release-assets
          node scripts/desktop-node.mjs
          config='{"build":{"beforeBuildCommand":""}}'
          TAURI_CONFIG="$config" pnpm run desktop:test
          # Retain the .app for smoke checks; dmg alone removes it.
          pnpm run desktop:build --config "$config" --ci --no-sign --bundles app,dmg
          pnpm run desktop:smoke "src-tauri/target/release/bundle/macos/Shiqu.app/Contents/Resources/runtime"
          installers=(src-tauri/target/release/bundle/dmg/Shiqu_*.dmg)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo 'Expected exactly one DMG for this architecture' >&2
            exit 1
          fi
          cp "${installers[0]}" "release-assets/shiqu-standard-macos-$ARCH.dmg"
      - name: Test, package, install, and smoke Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            param([string]$Command, [string[]]$Arguments)
            & $Command @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Command failed with exit code $LASTEXITCODE" }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Invoke-Checked node @('scripts/desktop-node.mjs')
          # Platform config is auto-merged; skip only the repeated preparation hook.
          $env:TAURI_CONFIG = '{"build":{"beforeBuildCommand":""}}'
          $configPath = Join-Path $env:RUNNER_TEMP 'shiqu-tauri-ci.json'
          $env:TAURI_CONFIG | Set-Content $configPath -Encoding utf8
          Invoke-Checked pnpm @('run', 'desktop:test')
          Invoke-Checked pnpm @('run', 'desktop:build', '--config', $configPath, '--ci', '--no-sign', '--bundles', 'nsis')
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = $installers[0].FullName
          $destination = Join-Path $env:RUNNER_TEMP 'shiqu installed desktop'
          # NSIS requires /D last, without quotes, even when the destination contains spaces.
          $installed = Start-Process -FilePath $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          try {
            if (!(Test-Path "$destination/shiqu-desktop.exe")) { throw 'Installed desktop executable is missing' }
            Invoke-Checked pnpm @('run', 'desktop:smoke', "$destination/runtime")
            Copy-Item $installer 'release-assets/shiqu-standard-windows-x64-setup.exe'
          } finally {
            $uninstaller = Join-Path $destination 'uninstall.exe'
            if (Test-Path $uninstaller) {
              $removed = Start-Process -FilePath $uninstaller -ArgumentList "/S _?=$destination" -Wait -PassThru
              if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: shiqu-standard-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/shiqu-standard-*
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: shiqu-standard-*
          merge-multiple: true
          path: release-assets
      - name: Verify all downloads and generate checksums
        working-directory: release-assets
        run: |
          test -s shiqu-standard-macos-arm64.dmg
          test -s shiqu-standard-windows-x64-setup.exe
          shasum -a 256 shiqu-standard-macos-arm64.dmg shiqu-standard-windows-x64-setup.exe > SHA256SUMS.txt
      - name: Upload all installers before publishing
        working-directory: release-assets
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/shiqu-release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/shiqu-release-draft")" != true ]]; then
              echo 'This release is already published; refusing to replace its downloads' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Shiqu $RELEASE_TAG" --generate-notes \
              --notes 'Unsigned installers for macOS Apple Silicon (arm64, macOS 13.5+) and Windows x64 (Windows 10/11). Both desktop installers include Node 24. Windows supports OpenAI API, Gemini, and read-only mode and needs WebView2 (downloaded by the installer if missing). macOS apps are not notarized; Windows SmartScreen may show a warning. SHA-256 checksums for both installers are included in SHA256SUMS.txt.'
          fi
          gh release upload "$RELEASE_TAG" shiqu-standard-macos-arm64.dmg shiqu-standard-windows-x64-setup.exe SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
