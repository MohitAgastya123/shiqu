<!doctype html>
<!-- Standalone cached bookshelf and reader; external story discovery requires an internet connection. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193f35"><title>Shiqu · Offline shelf</title><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#25372f;font:15px/1.7 system-ui,sans-serif}header,main,footer{max-width:660px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd8cc}a{color:inherit}h1,h2{font-family:serif}h1{font-size:26px;margin:24px 0 8px}p{color:#7b8074}button{border:1px solid #d4d7cb;background:transparent;color:#193f35;padding:12px 18px;border-radius:8px;cursor:pointer;font:inherit}button.primary{background:#193f35;color:white}button:disabled{opacity:.4}article{margin:20px 0;padding:18px;border:1px solid #dcdccf;border-radius:12px;display:flex;gap:18px;align-items:center}article img{width:90px;border-radius:5px}article h2{font-size:20px;margin:0}article small{color:#7b8074}.caption{white-space:pre-line;font:600 25px/1.6 serif;margin:0;padding:26px 22px;background:#fffdf8;color:#233a31}.picture{display:block;width:100%}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.foot small{color:#7b8074}audio{width:100%;margin-top:10px}.fine{font-size:12px}#clear{margin-top:22px}.ending{background:#e9eddf;padding:24px;border-radius:10px}</style></head><body><header><strong>Shiqu <small> / Offline shelf</small></strong><a href="/read">Back online</a></header><main id="app"></main><footer><a href="https://yysun.github.io/awesome-shiqu/" target="_blank" rel="noopener noreferrer">Read Shiqu stories online →</a><p class="fine">Internet required · awesome-shiqu</p></footer><script>
const app=document.querySelector('#app');let current=null,page=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(text,action,cls){const b=el('button',text,cls);b.onclick=action;return b;}
async function shelf(){app.replaceChildren(el('h1','Saved stories, ready whenever you are.'),el('p','Offline stories are stored on this device. Offline reading is not included in usage statistics.'));try{const c=await caches.open('yiyu-offline-v1');const keys=(await c.keys()).filter(k=>new URL(k.url).pathname.startsWith('/offline-data/'));if(!keys.length)app.append(el('p','No offline stories yet. Open a story online and choose “Save offline”.'));for(const key of keys){const s=await(await c.match(key)).json();const card=el('article');const img=el('img');img.src=s.pages[0].image;img.alt='';const info=el('div');info.append(el('h2',s.title),el('p',s.pages.length+' pages'),button('Open story',()=>{current=s;page=0;read();},'primary'));card.append(img,info);app.append(card);}if(keys.length){const clear=button('Clear offline stories on this device',async()=>{if(confirm('Delete all offline stories on this device? Stories on the server are kept.')){await caches.delete('yiyu-offline-v1');shelf();}});clear.id='clear';app.append(clear);}}catch{app.append(el('p','This browser does not support offline storage. Return online to read.'));}}
function read(){const p=current.pages[page];app.replaceChildren();app.append(button('← Offline shelf',shelf),el('h1',current.title),el('p',p.caption,'caption'));const img=el('img');img.src=p.image;img.alt=p.caption;img.className='picture';app.append(img);const nav=el('div',undefined,'foot');const prev=button('Previous page',()=>{page--;read();});prev.disabled=page===0;nav.append(prev,el('small',(page+1)+' / '+current.pages.length),button(page===current.pages.length-1?'Finish reading':'Next page',()=>{if(page<current.pages.length-1){page++;read();}else{app.replaceChildren(el('h1','Close the story. Let it stay with you.'),el('p',current.reflection,'ending'),button('Back to offline shelf',shelf,'primary'));}},'primary'));app.append(nav,el('p','AI generated illustrations · Adapted from classic literature','fine'));window.scrollTo(0,0);}
shelf();
</script></body></html>
